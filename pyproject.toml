[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-studio-connector"
version = "0.1.0"
description = "Private MCP connector for Zoho Inventory (OAuth 2.0) and Freshdesk (API key) for Agent Studio style agents"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27,<1",
    "pydantic[email]>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
    "itsdangerous>=2,<3",
    "anthropic>=1.0,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "respx>=0.21,<1", "ruff>=0.5,<1"]

[project.scripts]
connector = "cli:main"

[tool.setuptools]
packages = { find = { include = ["api*", "ui*"] } }
py-modules = ["cli"]

[tool.setuptools.package-data]
"api.integrations.config" = ["*.json"]
"ui" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["ui/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
